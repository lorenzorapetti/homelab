---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
# The FluxInstance syncs this path directly (flux-system/flux-instance/app/helmrelease.yaml).
# Apps are added one at a time: docs/docs/kubernetes/adding-apps.md
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./kube-system
  - ./flux-system
  - ./longhorn-system
  - ./cert-manager
  - ./network
  - ./cnpg-system
  - ./auth
  - ./observability
  - ./glance
  - ./volsync-system
  - ./git
  - ./orbit
  - ./actual

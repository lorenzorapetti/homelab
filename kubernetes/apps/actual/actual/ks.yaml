---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# Actual Budget (actualbudget/actual), the budgeting app at budget.<domain>.
# Plain manifests, no chart. Login through authentik (OIDC), budgets in SQLite
# on the `actual` PVC, backed up nightly by VolSync.
# Docs: docs/docs/kubernetes/actual.md
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app actual
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: longhorn
      namespace: longhorn-system
    - name: gateway
      namespace: kube-system
    - name: authentik               # OIDC login
      namespace: auth
    - name: volsync                 # the ReplicationSource CRD
      namespace: volsync-system
  interval: 1h
  path: ./kubernetes/apps/actual/actual/app
  patches: []                       # required by the FluxInstance's injected patch
  postBuild:
    # For the volsync component: APP is the PVC to back up, VOLSYNC_PUID/PGID
    # the image's `actual` user (1001), the rest fill in its restic Secret.
    substitute:
      APP: *app
      VOLSYNC_PUID: "1001"
      VOLSYNC_PGID: "1001"
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
      - name: r2-backup
        kind: Secret
      - name: volsync-restic
        kind: Secret
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: actual
  timeout: 5m
  wait: true

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
# Actual has its own login (authentik OIDC), so no forward auth.
# ExternalDNS publishes budget.<domain> to Home DNS from this route.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: actual
spec:
  parentRefs:
    - name: main
      namespace: kube-system
      sectionName: https
  hostnames: ["budget.${SECRET_DOMAIN}"]
  rules:
    - backendRefs:
        - name: actual
          port: 80

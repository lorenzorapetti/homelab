---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/apps/deployment_v1.json
# Actual's sync server: one Node process serving the web app and syncing the
# budgets, which live in SQLite files under /data. No database server.
# Settings reference: packages/sync-server/src/load-config.js in
# actualbudget/actual (every setting is an ACTUAL_* env var).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: actual
spec:
  replicas: 1                       # SQLite on a RWO PVC: one writer only
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: actual
  template:
    metadata:
      labels:
        app.kubernetes.io/name: actual
    spec:
      automountServiceAccountToken: false   # Actual never talks to the Kubernetes API
      enableServiceLinks: false
      securityContext:
        # The image has no USER, so it would run as root. 1001 is its
        # `actual` user, which owns /data in the image.
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: actual
          image: docker.io/actualbudget/actual-server:26.11.0
          ports:
            - name: http
              containerPort: 5006
          envFrom:
            - secretRef:
                name: actual-secrets
          env:
            - name: ACTUAL_DATA_DIR
              value: /data
            # Requests through the Gateway come from Cilium's Envoy, whose
            # address is in the pod CIDR (talos/all/10-network.yaml). The
            # default trusts all of 10.0.0.0/8, which includes the LAN.
            - name: ACTUAL_TRUSTED_PROXIES
              value: 10.244.0.0/16
            # Login through authentik (only `authentik Admins`:
            # blueprints/actual.yaml). The server configures OpenID at start
            # from these. The first person to log in becomes the owner
            # (ADMIN); later ones need a user created by the owner first
            # (ACTUAL_USER_CREATION_MODE=manual, the default).
            - name: ACTUAL_LOGIN_METHOD
              value: openid
            - name: ACTUAL_ALLOWED_LOGIN_METHODS
              value: openid
            - name: ACTUAL_OPENID_ENFORCE
              value: "true"
            - name: ACTUAL_OPENID_PROVIDER_NAME
              value: authentik
            - name: ACTUAL_OPENID_DISCOVERY_URL
              value: https://auth.${SECRET_DOMAIN}/application/o/actual/.well-known/openid-configuration
            - name: ACTUAL_OPENID_CLIENT_ID
              value: actual
            - name: ACTUAL_OPENID_SERVER_HOSTNAME
              value: https://budget.${SECRET_DOMAIN}
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 24       # 2 minutes
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: actual
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi

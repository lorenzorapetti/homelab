---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# The VolSync operator: backs up app PVCs to R2 with restic (ADR 0003). Apps
# opt in with the volsync component (kubernetes/components/volsync).
# Docs: docs/docs/kubernetes/backups-volsync.md
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app volsync
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: prometheus-operator-crds  # for the chart's ServiceMonitor and the PrometheusRule
      namespace: observability
  interval: 1h
  path: ./kubernetes/apps/volsync-system/volsync/app
  patches: []                       # required by the FluxInstance's injected patch
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: volsync-system
  timeout: 5m
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: volsync
      namespace: volsync-system

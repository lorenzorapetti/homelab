---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/podmonitor_v1.json
# The Flux controllers' own metrics (reconcile durations and errors, workqueues)
# on port http-prom (8080). Copied from fluxcd/flux2-monitoring-example; the
# controllers have no Service for it. The FluxInstance's allow-scraping
# NetworkPolicy lets any namespace in on 8080.
# Docs: docs/docs/kubernetes/flux/monitoring.md
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: flux-system
spec:
  namespaceSelector:
    matchNames: [flux-system]
  selector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - helm-controller
          - source-controller
          - kustomize-controller
          - notification-controller
          - image-automation-controller
          - image-reflector-controller
  podMetricsEndpoints:
    - port: http-prom

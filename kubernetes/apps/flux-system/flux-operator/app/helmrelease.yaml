---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
# Adopts the `flux-operator` release that bootstrap/helmfile installed (same name
# and namespace). Chart defaults: bootstrap/helmfile reads `spec.values` from here.
# Docs: docs/docs/kubernetes/flux/intro.md#flux-manages-itself
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: flux-operator
  values:
    # flux_resource_info / flux_instance_info are refreshed with the FluxReport.
    # The Flux Operator docs recommend 30s (default 5m) when Prometheus reads them.
    # Docs: docs/docs/kubernetes/flux/monitoring.md
    reporting:
      interval: 30s
    # Scrapes the operator's Service on 8080. Needs the ServiceMonitor CRD:
    # ks.yaml dependsOn prometheus-operator-crds, and bootstrap/helmfile/apps.yaml
    # turns it off for the first install, before the CRD exists.
    serviceMonitor:
      create: true
      interval: 30s

# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# Orbit logs in against authentik with native OIDC (ORBIT_OIDC_*). Only
# `authentik Admins` may log in; a first login links to the Orbit account
# with the same email.
# Docs: docs/docs/kubernetes/orbit.md
#
# The client secret is ORBIT_OIDC_CLIENT_SECRET in the SOPS Secret
# authentik-orbit-oidc, and the same value is ORBIT_OIDC_CLIENT_SECRET in
# Secret orbit-secrets in `orbit`. The worker reads its env at start: restart
# it after changing the secret.
version: 1
metadata:
  name: Orbit OIDC
entries:
  # Orbit links a login to an existing account by email only when
  # `email_verified` is true, and authentik's managed `email` mapping sends
  # false. Only admins can log in to Orbit, and their email is set by an admin.
  - model: authentik_providers_oauth2.scopemapping
    id: scope-email-verified
    identifiers:
      name: "Orbit: email (verified)"
    attrs:
      scope_name: email
      description: Email address
      expression: |
        return {
            "email": request.user.email,
            "email_verified": True,
        }
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-orbit
    identifiers:
      name: Orbit
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: orbit
      client_secret: !Env ORBIT_OIDC_CLIENT_SECRET
      # Required: a blueprint-created provider defaults to none (see grafana.yaml).
      grant_types:
        - authorization_code
        - refresh_token
      redirect_uris:
        - matching_mode: strict
          url: https://board.${SECRET_DOMAIN}/api/v1/auth/providers/oidc/callback
          redirect_uri_type: authorization
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: hashed_user_id
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !KeyOf scope-email-verified
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
  - model: authentik_core.application
    id: app-orbit
    identifiers:
      slug: orbit                   # in the issuer URL Orbit reads
    attrs:
      name: Orbit
      provider: !KeyOf provider-orbit
      meta_launch_url: https://board.${SECRET_DOMAIN}
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-orbit
      order: 0
    attrs:
      group: !Find [authentik_core.group, [name, authentik Admins]]

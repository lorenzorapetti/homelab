# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# Grafana logs in against authentik with native OIDC (Grafana's generic OAuth).
# Only `authentik Admins` may log in, and they become Grafana server admins.
# Docs: docs/docs/kubernetes/observability/grafana-login.md
#
# The client secret is GRAFANA_OIDC_CLIENT_SECRET in the SOPS Secret
# authentik-secrets, and the same value is in Secret grafana-oidc in
# `observability`. The worker reads its env at start: restart it after
# changing the secret.
version: 1
metadata:
  name: Grafana OIDC
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-grafana
    identifiers:
      name: Grafana
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      # Not default-provider-invalidation-flow: this one has the logout stage,
      # so Grafana's sign-out also ends the authentik session.
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
      client_type: confidential
      client_id: grafana
      client_secret: !Env GRAFANA_OIDC_CLIENT_SECRET
      # Required: a blueprint-created provider defaults to none, and authentik
      # then refuses the login ("Invalid grant_type for provider"). The UI
      # fills these in, a blueprint doesn't.
      grant_types:
        - authorization_code
        - refresh_token
      redirect_uris:
        - matching_mode: strict
          url: https://grafana.${SECRET_DOMAIN}/login/generic_oauth
          redirect_uri_type: authorization
        - matching_mode: strict
          url: https://grafana.${SECRET_DOMAIN}/login
          redirect_uri_type: logout
      # RS256-signed tokens instead of HS256 with the client secret.
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: hashed_user_id
      # `profile` carries `groups`, which Grafana maps to its role.
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
  - model: authentik_core.application
    id: app-grafana
    identifiers:
      slug: grafana                 # in the end-session URL Grafana signs out through
    attrs:
      name: Grafana
      provider: !KeyOf provider-grafana
      meta_launch_url: https://grafana.${SECRET_DOMAIN}
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-grafana
      order: 0
    attrs:
      group: !Find [authentik_core.group, [name, authentik Admins]]

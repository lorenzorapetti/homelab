---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./ocirepository.yaml
  - ./httproute.yaml
  - ./referencegrant.yaml
  - ./secret.sops.yaml     # Secret `authentik-secrets`: AUTHENTIK_SECRET_KEY, AUTHENTIK_EMAIL__{USERNAME,PASSWORD,FROM}, GRAFANA_OIDC_CLIENT_SECRET
  - ./forgejo-oidc.sops.yaml  # Secret `authentik-forgejo-oidc`: FORGEJO_OIDC_CLIENT_SECRET
  - ./orbit-oidc.sops.yaml    # Secret `authentik-orbit-oidc`: ORBIT_OIDC_CLIENT_SECRET
  - ./actual-oidc.sops.yaml   # Secret `authentik-actual-oidc`: ACTUAL_OIDC_CLIENT_SECRET
# Blueprints, mounted through the chart's `blueprints.configMaps`. The worker
# watches the files and re-applies them when the ConfigMap changes, so no hash
# suffix (and no restart) is needed. ${SECRET_DOMAIN} is substituted by Flux.
configMapGenerator:
  - name: authentik-blueprints
    files:
      - ./blueprints/forward-auth.yaml
      - ./blueprints/grafana.yaml
      - ./blueprints/forgejo.yaml
      - ./blueprints/orbit.yaml
      - ./blueprints/actual.yaml
      - ./blueprints/passkeys.yaml
      - ./blueprints/passkeys-enforce.yaml
    options:
      disableNameSuffixHash: true
  # Server requests, flows, policies, worker tasks and database queries. The
  # chart ships no dashboard. Grafana's sidecar loads it through the
  # grafana_dashboard label.
  - name: authentik-dashboard
    files:
      - ./dashboards/authentik.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Auth
        # The JSON uses ${datasource} and label_replace's $1, which Flux must not substitute.
        kustomize.toolkit.fluxcd.io/substitute: disabled

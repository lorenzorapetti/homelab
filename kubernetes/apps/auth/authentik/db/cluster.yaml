---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/cluster_v1.json
# CNPG creates Secret authentik-db-app (host, port, dbname, user, password)
# and Service authentik-db-rw, which the HelmRelease reads.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authentik-db
spec:
  # One instance while all VMs share one host: Longhorn already keeps 2 replicas
  # of the volume, and R2 holds the backups (ADR 0002).
  instances: 1
  # The operator's own default, pinned. `minimal`: the backup tools run in the
  # plugin's sidecar, not in this image.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-minimal-trixie
  bootstrap:
    initdb:
      database: authentik
      owner: authentik
  storage:
    storageClass: longhorn
    size: 5Gi
  # The postgres container's working set sits around 150Mi; the request leaves
  # headroom so the dashboard's Memory Utilisation (pod working set / request)
  # reflects real pressure.
  resources:
    requests:
      cpu: 50m
      memory: 384Mi
    limits:
      memory: 1Gi
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: authentik-r2

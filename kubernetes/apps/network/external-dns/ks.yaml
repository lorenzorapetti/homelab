---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# ExternalDNS: HTTPRoute hostnames -> A records in Home DNS (Technitium) only.
# Why only Home DNS: docs/adr/0001-app-names-only-in-home-dns.md
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app external-dns
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: gateway                 # the HTTPRoute CRD, and the Gateway address it publishes
      namespace: kube-system
    - name: prometheus-operator-crds  # for the chart's ServiceMonitor and the PrometheusRule
      namespace: observability
  interval: 1h
  path: ./kubernetes/apps/network/external-dns/app
  patches: []                       # required by the FluxInstance's injected patch
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: network
  timeout: 5m
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: external-dns
      namespace: network

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
spec:
  interval: 1h
  chart:
    spec:
      chart: external-dns
      version: 1.23.0               # app v0.23.0; latest chart on 2026-11-19
      sourceRef:
        kind: HelmRepository
        name: external-dns
  values:
    provider:
      name: rfc2136
    # Only HTTPRoutes. The record target is the Gateway's status address (10.0.12.1),
    # so no --default-targets. Forgejo SSH is a TCPRoute on the same Gateway and
    # shares its HTTPRoute's name, so it needs no source of its own.
    sources:
      - gateway-httproute
    policy: sync                    # deletes records it owns (TXT registry) when a route goes away
    registry: txt
    txtOwnerId: home
    domainFilters:
      - ${SECRET_DOMAIN}
    triggerLoopOnEvent: true
    extraArgs:
      - --rfc2136-host=10.0.1.30
      - --rfc2136-port=53
      - --rfc2136-zone=${SECRET_DOMAIN}
      - --rfc2136-tsig-keyname=external-dns
      - --rfc2136-tsig-secret-alg=hmac-sha256
      - --rfc2136-axfr              # sync needs AXFR to list existing records
    env:
      - name: EXTERNAL_DNS_RFC2136_TSIG_SECRET
        valueFrom:
          secretKeyRef:
            name: external-dns-tsig
            key: secret

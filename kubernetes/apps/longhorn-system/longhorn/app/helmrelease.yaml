---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
# Docs: docs/docs/kubernetes/storage-longhorn.md
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
spec:
  interval: 1h
  chart:
    spec:
      chart: longhorn
      version: 1.13.0               # chart kubeVersion: >=1.34.0-0
      sourceRef:
        kind: HelmRepository
        name: longhorn
  values:
    defaultSettings:
      # The Talos user volume (talos/all/20-longhorn.yaml) on each VM's scsi1 disk.
      defaultDataPath: /var/mnt/longhorn
      # Volumes created outside a StorageClass (e.g. from the UI).
      defaultReplicaCount: 2
      # Zones are Proxmox hosts (topology.kubernetes.io/zone, talos/all/30-zone.yaml.tpl).
      # Scheduling already prefers another zone (replicaZoneSoftAntiAffinity defaults to
      # true); best-effort also moves existing replicas so a volume's two copies end up on
      # different hosts. It only acts on Healthy volumes.
      replicaAutoBalance: best-effort
    persistence:
      # The only StorageClass in the cluster.
      defaultClass: true
      # Two replicas survive one node down (a Talos upgrade, a VM failure), and with
      # one per Proxmox host, one host down. A third would land on hecate again.
      defaultClassReplicaCount: 2
      reclaimPolicy: Delete
    # Exposed at longhorn.<domain> behind authentik forward auth by the longhorn-ui
    # Kustomization (../ui/httproute.yaml), not the chart's httproute: that one
    # can't add the /outpost.goauthentik.io rule. One replica is plenty.
    longhornUI:
      replicas: 1
    # longhorn-manager's metrics (volumes, replicas, nodes, disks) on port
    # `manager` of every manager pod. Rules and dashboard: ./prometheusrule.yaml,
    # ./dashboards/longhorn.json.
    metrics:
      serviceMonitor:
        enabled: true
        interval: 30s
    networkPolicies:
      # The chart's longhorn-manager NetworkPolicy (restrictInternalTraffic,
      # on by default) only lets Longhorn's own pods reach port 9500, which also
      # serves the manager's REST API. Let in Prometheus's pods, and only those.
      metricsScrapeSources:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
              operator.prometheus.io/name: kube-prometheus-stack

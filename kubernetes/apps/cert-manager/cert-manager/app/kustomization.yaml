---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./ocirepository.yaml
  - ./prometheusrule.yaml
  - ./secret.sops.yaml     # Cloudflare API token, Secret `cloudflare-token` key `apiToken`
# Certificates with their expiry, renewal and readiness, issuers, and ACME
# activity. The chart ships no dashboard. Grafana's sidecar loads it through
# the grafana_dashboard label.
configMapGenerator:
  - name: cert-manager-dashboard
    files:
      - ./dashboards/cert-manager.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Network
        # The JSON uses ${datasource} and $__rate_interval, which Flux must not substitute.
        kustomize.toolkit.fluxcd.io/substitute: disabled

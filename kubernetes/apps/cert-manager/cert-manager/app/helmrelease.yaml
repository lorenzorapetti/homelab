---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
# CRD install/upgrade policies come from the FluxInstance's injected HelmRelease defaults.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: cert-manager
  values:
    crds:
      enabled: true
    # Check DNS-01 propagation against Cloudflare's public resolvers, not the
    # in-cluster DNS (which may answer from a split-horizon view of the domain).
    extraArgs:
      - --dns01-recursive-nameservers-only
      - --dns01-recursive-nameservers=1.1.1.1:53,1.0.0.1:53
    # The controller's metrics (certificate expiry, renewal time, readiness,
    # ACME requests). honorLabels keeps each Certificate's own `namespace`
    # instead of renaming it exported_namespace, so its alerts group with the
    # app's. Rules and dashboard: ./prometheusrule.yaml, ./dashboards/.
    prometheus:
      enabled: true
      servicemonitor:
        enabled: true
        interval: 60s
        honorLabels: true

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/servicemonitor_v1.json
# Orbit's /metrics on its own port (ORBIT_METRICS_LISTEN), which has no auth
# and isn't routed by the HTTPRoute.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: orbit
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: orbit
  endpoints:
    - port: metrics
      path: /metrics
      interval: 60s

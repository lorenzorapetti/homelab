---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../../../../components/volsync  # nightly restic backup of PVC orbit to R2
resources:
  - ./pvc.yaml
  - ./deployment.yaml
  - ./service.yaml
  - ./httproute.yaml
  - ./servicemonitor.yaml
  # Secret orbit-secrets: ORBIT_APP_KEY, ORBIT_OIDC_CLIENT_SECRET,
  # ORBIT_SMTP_PASSWORD and ORBIT_SMTP_FROM. Every key becomes an env var, and
  # Orbit refuses to start on an ORBIT_* variable it doesn't know.
  - ./secret.sops.yaml

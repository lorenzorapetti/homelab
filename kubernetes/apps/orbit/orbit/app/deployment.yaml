---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/apps/deployment_v1.json
# Orbit is one binary: `serve` runs the web app, background jobs, the
# scheduler and the database migrations (at every start). No worker, no Redis.
# Settings reference: docs/operations.md in coollabsio/orbit.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbit
spec:
  replicas: 1                       # more than one needs S3 for attachments
  # RWO PVC, and some migrations want every server stopped first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: orbit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orbit
    spec:
      automountServiceAccountToken: false   # Orbit never talks to the Kubernetes API
      # Otherwise Services orbit-db-rw/-ro/-r inject ORBIT_DB_*_PORT…, and
      # Orbit refuses to start on an ORBIT_* variable it doesn't know.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532              # the image's USER
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: orbit
          image: ghcr.io/coollabsio/orbit:0.4.1
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          envFrom:
            - secretRef:
                name: orbit-secrets
          env:
            - name: ORBIT_PUBLIC_ORIGIN
              value: https://board.${SECRET_DOMAIN}
            # Requests through the Gateway come from Cilium's Envoy, whose
            # address is in the pod CIDR (talos/all/10-network.yaml). Orbit
            # trusts X-Forwarded-* only from these. Loopback for the image's
            # own `/orbit healthcheck`, which the probes run.
            - name: ORBIT_TRUSTED_PROXIES
              value: 127.0.0.1/32,10.244.0.0/16
            # CNPG's connection URI, password included.
            - name: ORBIT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: orbit-db-app
                  key: uri
            # Two pools of this size plus one lock connection: 21 of
            # Postgres' 100 (the default is 20 per pool).
            - name: ORBIT_DATABASE_MAX_CONNECTIONS
              value: "10"
            # Unauthenticated, so only on the metrics port, which the
            # HTTPRoute doesn't route.
            - name: ORBIT_METRICS_LISTEN
              value: 0.0.0.0:9090
            # Mail through Resend, like authentik and Forgejo. Password (the
            # API key) and From are in orbit-secrets.
            - name: ORBIT_SMTP_HOST
              value: smtp.resend.com
            - name: ORBIT_SMTP_SECURITY
              value: starttls
            - name: ORBIT_SMTP_PORT
              value: "587"
            - name: ORBIT_SMTP_USERNAME
              value: resend
            - name: ORBIT_SMTP_FROM_NAME
              value: Orbit
            # Login through authentik. Registration stays closed; the first
            # OIDC login creates the account (authentik only lets `authentik
            # Admins` through: blueprints/orbit.yaml).
            - name: ORBIT_OIDC_ISSUER
              value: https://auth.${SECRET_DOMAIN}/application/o/orbit/
            - name: ORBIT_OIDC_CLIENT_ID
              value: orbit
            - name: ORBIT_OIDC_DISPLAY_NAME
              value: authentik
            - name: ORBIT_OIDC_PROVISION
              value: "true"
            - name: ORBIT_OPEN_REGISTRATION
              value: "false"
          # Exec probes: the image's own healthcheck. An httpGet probe comes
          # from the node's address, which Orbit doesn't trust as a proxy.
          startupProbe:
            exec:
              command: [/orbit, healthcheck]
            periodSeconds: 5
            failureThreshold: 60       # 5 minutes for the first migrations
          readinessProbe:
            exec:
              command: [/orbit, healthcheck]
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: [/orbit, healthcheck]
            periodSeconds: 30
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/orbit
            - name: backups
              mountPath: /var/backups/orbit
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: orbit
        # Orbit's own backups (incl. the one it takes before some migrations).
        # Scratch only: CNPG (database) and VolSync (attachments) are the
        # real backups.
        - name: backups
          emptyDir:
            sizeLimit: 2Gi
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi

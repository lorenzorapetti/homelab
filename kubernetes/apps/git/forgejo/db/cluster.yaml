---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/cluster_v1.json
# CNPG creates Secret forgejo-db-app (host, port, dbname, user, password)
# and Service forgejo-db-rw, which the HelmRelease reads.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: forgejo-db
spec:
  # One instance while all VMs share one host: Longhorn already keeps 2 replicas
  # of the volume, and R2 holds the backups (ADR 0002).
  instances: 1
  # The operator's own default, pinned. `minimal`: the backup tools run in the
  # plugin's sidecar, not in this image.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-minimal-trixie
  bootstrap:
    initdb:
      database: forgejo
      owner: forgejo
  storage:
    storageClass: longhorn
    size: 5Gi
  # Same as authentik-db, whose postgres container sits around 150Mi. Lower the
  # request once Forgejo's own working set is known.
  resources:
    requests:
      cpu: 50m
      memory: 384Mi
    limits:
      memory: 1Gi
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: forgejo-r2

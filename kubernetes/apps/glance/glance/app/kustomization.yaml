---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./deployment.yaml
  - ./service.yaml
  - ./httproute.yaml
# The hash suffix rolls the Deployment whenever glance.yml changes.
# ${SECRET_DOMAIN} in glance.yml is substituted by Flux.
configMapGenerator:
  - name: glance-config
    files:
      - ./glance.yml

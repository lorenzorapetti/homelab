---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# Glance, the homelab start page at home.<domain>, behind authentik forward
# auth. Plain manifests, no chart. Stateless: the whole page is glance.yml.
# Docs: docs/docs/kubernetes/glance.md
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app glance
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: gateway
      namespace: kube-system
    - name: authentik               # forward auth
      namespace: auth
  interval: 1h
  path: ./kubernetes/apps/glance/glance/app
  patches: []                       # required by the FluxInstance's injected patch
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: glance
  timeout: 5m
  wait: true

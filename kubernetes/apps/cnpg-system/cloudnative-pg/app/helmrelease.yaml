---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
# CRD install/upgrade policies come from the FluxInstance's injected HelmRelease defaults.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: cloudnative-pg
  values:
    crds:
      create: true
    monitoring:
      # The operator's own metrics. Each Cluster's instances get a PodMonitor
      # next to the Cluster (spec.monitoring.enablePodMonitor is deprecated).
      podMonitorEnabled: true
      # CNPG's cluster dashboard ships from ./dashboards instead (see
      # kustomization.yaml): the chart's copy reads backup metrics the
      # barman-cloud plugin doesn't populate.
      grafanaDashboard:
        create: false

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# The observability namespace's Postgres: one CNPG Cluster on Longhorn, archived
# to R2. Grafana's `grafana` database today; later observability apps add theirs.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app observability-db
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: longhorn
      namespace: longhorn-system
    - name: plugin-barman-cloud
      namespace: cnpg-system
  interval: 1h
  path: ./kubernetes/apps/observability/observability-db/app
  patches: []                       # required by the FluxInstance's injected patch
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: observability
  timeout: 10m
  # A CNPG Cluster reports a Ready condition once the primary accepts connections.
  healthChecks:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: observability-db
      namespace: observability

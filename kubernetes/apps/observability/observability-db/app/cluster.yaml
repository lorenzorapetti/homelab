---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/cluster_v1.json
# One Cluster for the whole observability namespace. initdb creates Grafana's
# database `grafana`, owned by role `grafana`, and CNPG puts that role's
# credentials in Secret observability-db-app. Later databases get their own
# role (spec.managed.roles) and `Database` object.
# Service observability-db-rw is the read-write endpoint.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: observability-db
spec:
  # One instance while all VMs share one host: Longhorn already keeps 2 replicas
  # of the volume, and R2 holds the backups (ADR 0002).
  instances: 1
  # The operator's own default, pinned. `minimal`: the backup tools run in the
  # plugin's sidecar, not in this image.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-minimal-trixie
  bootstrap:
    initdb:
      database: grafana
      owner: grafana
  storage:
    storageClass: longhorn
    size: 5Gi
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: observability-r2

---
# Throwaway: a Kustomization pointing at a path that doesn't exist, to test
# FluxResourceNotReady (#189). Reverted right after the test.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-alert-test
spec:
  interval: 1h
  path: ./kubernetes/apps/does-not-exist
  patches: []                       # required by the FluxInstance's injected patch
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 1m

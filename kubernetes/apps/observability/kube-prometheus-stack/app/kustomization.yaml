---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./alertmanager-notifications.sops.yaml   # Secret `alertmanager-notifications`: Pushover keys, healthchecks.io ping URL
  - ./grafana-oidc.sops.yaml   # Secret `grafana-oidc`: Grafana's authentik client secret
  - ./helmrelease.yaml
  - ./ocirepository.yaml
# One page with node-exporter's basics for every node side by side (the chart's
# Node Exporter dashboards show one node at a time). Grafana's sidecar loads it
# through the grafana_dashboard label.
configMapGenerator:
  - name: nodes-overview-dashboard
    files:
      - ./dashboards/nodes-overview.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Kubernetes
        # The JSON uses ${datasource} and $node, which Flux must not substitute.
        kustomize.toolkit.fluxcd.io/substitute: disabled
  # Everything worth checking when debugging the cluster, on one page: problem
  # counters, Talos nodes, control plane and etcd, workloads and PVCs, Flux,
  # CNPG, Longhorn, Cilium and the Gateway, certificates and ExternalDNS,
  # authentik, CoreDNS and Prometheus itself.
  - name: cluster-health-dashboard
    files:
      - ./dashboards/cluster-health.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Kubernetes
        # The JSON uses ${datasource} and label_replace's $1, which Flux must not substitute.
        kustomize.toolkit.fluxcd.io/substitute: disabled

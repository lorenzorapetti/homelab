---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# The Prometheus Operator CRDs (ServiceMonitor, PodMonitor, PrometheusRule…) on
# their own, with no dependencies, so any app can ship monitors without waiting
# for kube-prometheus-stack, and kube-prometheus-stack can wait for apps (e.g.
# its database) without a dependency cycle. Apps with monitors `dependsOn` this.
# Docs: docs/docs/kubernetes/observability/intro.md
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app prometheus-operator-crds
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  interval: 1h
  path: ./kubernetes/apps/observability/prometheus-operator-crds/app
  patches: []                       # required by the FluxInstance's injected patch
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: observability
  timeout: 5m
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: prometheus-operator-crds
      namespace: observability

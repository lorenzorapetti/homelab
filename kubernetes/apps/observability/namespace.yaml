---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/v1/namespace.json
# node-exporter needs hostNetwork, hostPID and host paths; Talos applies `baseline`
# to every namespace but kube-system.
# Docs: docs/docs/kubernetes/observability/intro.md
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged

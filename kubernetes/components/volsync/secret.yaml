---
# Not a SOPS file: every value is filled in by Flux's postBuild substitution,
# from cluster-secrets (endpoint, bucket), r2-backup (the R2 token) and
# volsync-restic (the repository password, shared by every app).
apiVersion: v1
kind: Secret
metadata:
  name: ${APP}-volsync
stringData:
  RESTIC_REPOSITORY: s3:${SECRET_R2_ENDPOINT}/${SECRET_R2_BUCKET}/${APP}/volsync
  RESTIC_PASSWORD: ${VOLSYNC_RESTIC_PASSWORD}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}

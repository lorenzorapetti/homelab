---
# yaml-language-server: $schema=https://json.schemastore.org/helmfile
# Bootstrap releases, installed in order by `just bootstrap::helmfile`. Chart,
# version and values come from the Flux manifests (default.yaml), so a fresh
# bootstrap installs exactly what Flux then takes over.
# Docs: docs/docs/kubernetes/getting-started/bootstrap.md
bases:
  - ./default.yaml
---
helmDefaults:
  cleanupOnFail: true
  forceConflicts: true
  wait: true
  waitForJobs: true

releases:
  - name: cilium
    namespace: kube-system
    inherit: [{template: default}]

  - name: flux-operator
    namespace: flux-system
    inherit: [{template: default}]
    needs: ["kube-system/cilium"]

  - name: flux-instance
    namespace: flux-system
    inherit: [{template: default}]
    needs: ["flux-system/flux-operator"]

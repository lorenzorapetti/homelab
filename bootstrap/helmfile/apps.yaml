---
# yaml-language-server: $schema=https://json.schemastore.org/helmfile
# Bootstrap releases, installed in order by `just bootstrap::helmfile`. Chart,
# version and values come from the Flux manifests (default.yaml), so a fresh
# bootstrap installs exactly what Flux then takes over.
# Docs: docs/docs/kubernetes/getting-started/bootstrap.md
bases:
  - ./default.yaml
---
helmDefaults:
  cleanupOnFail: true
  forceConflicts: true
  wait: true
  waitForJobs: true

releases:
  - name: cilium
    namespace: kube-system
    inherit: [{template: default}]
    # Appended after the template's values: the ServiceMonitor CRD doesn't
    # exist yet on a fresh cluster (the chart's validate.yaml fails without
    # it). Flux turns them on when it takes over.
    values:
      - prometheus:
          serviceMonitor:
            enabled: false
        operator:
          prometheus:
            serviceMonitor:
              enabled: false
        envoy:
          prometheus:
            serviceMonitor:
              enabled: false
        hubble:
          metrics:
            serviceMonitor:
              enabled: false

  - name: flux-operator
    namespace: flux-system
    inherit: [{template: default}]
    needs: ["kube-system/cilium"]
    # Appended after the template's values: the ServiceMonitor CRD doesn't
    # exist yet on a fresh cluster. Flux turns it on when it takes over.
    values:
      - serviceMonitor:
          create: false

  - name: flux-instance
    namespace: flux-system
    inherit: [{template: default}]
    needs: ["flux-system/flux-operator"]

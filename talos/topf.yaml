---
# topf: https://github.com/postfinance/topf/blob/main/docs/configuration.md
# Docs: docs/docs/kubernetes/getting-started/install-talos.md
clusterName: homelab
clusterEndpoint: https://10.0.11.10:6443   # the API VIP (control-plane/00-cluster.yaml)
# renovate: datasource=github-releases depName=kubernetes/kubernetes
kubernetesVersion: 1.37.2
# renovate: datasource=github-releases depName=siderolabs/talos
talosVersion: 1.14.6                      # bump + `just talos::upgrade`; talos_version in the tfvars only seeds new VMs (docs: Upgrades)
schematicId: "@schematic.yaml"
platform: nocloud                          # matches the nocloud image Terraform boots
secretsPath: secrets.sops.yaml             # SOPS-encrypted (rule 2 in .sops.yaml)

# data.proxmoxHost: the Proxmox host the VM runs on (proxmox_node in the tfvars).
# all/30-zone.yaml.tpl turns it into the node's topology.kubernetes.io/zone label.
nodes:
  - host: talos-1
    ip: 10.0.11.1
    role: control-plane
    data:
      proxmoxHost: hecate
  - host: talos-2
    ip: 10.0.11.2
    role: control-plane
    data:
      proxmoxHost: hecate
  - host: talos-3
    ip: 10.0.11.3
    role: control-plane
    data:
      proxmoxHost: persephone
